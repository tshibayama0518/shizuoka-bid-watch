name: 案件データ更新

on:
  schedule:
    - cron: '30 21 * * *'   # 毎日 6:30 (日本時間)
  workflow_dispatch:         # Actions 画面から手動実行も可能

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PDF読み取りツールを準備
        run: |
          if ! command -v pdftotext > /dev/null; then
            sudo apt-get update -q > /dev/null
            sudo apt-get install -y -q poppler-utils > /dev/null
          fi
          pdftotext -v

      - name: 案件を収集
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./scripts/collect.ps1

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/feed.xml docs/results.json docs/history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "案件データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 失敗したらスマホに通知
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: shizuoka-bid-watch: daily update failed" -H "Tags: warning" -H "Priority: 4" \
              -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The daily collection job failed. Tap to open the GitHub Actions log." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
