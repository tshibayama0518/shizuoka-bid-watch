name: 案件データ更新

on:
  schedule:
    - cron: '30 21 * * *'   # 毎日 6:30 (日本時間)
  workflow_dispatch:         # Actions 画面から手動実行も可能

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PDF読み取りツールを準備
        run: |
          if ! command -v pdftotext > /dev/null; then
            sudo apt-get update -q > /dev/null
            sudo apt-get install -y -q poppler-utils > /dev/null
          fi
          pdftotext -v

      - name: 案件を収集
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./scripts/collect.ps1

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/feed.xml docs/results.json docs/history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "案件データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 新着案件をメールで知らせる（GitHub Issue を作ると持ち主にメールが届く）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 scripts/daily_mail.py docs/data.json)
          echo "新着: $n 件"
          if [ "$n" -gt 0 ]; then
            title=$(cat mail_title.txt)
            today=$(TZ=Asia/Tokyo date +%F)
            if gh issue list --state all --limit 20 --json title --jq '.[].title' | grep -F "【入札ラボ】新着案件" | grep -qF "（$today）"; then
              echo "今日の通知は送信済み"
            else
              url=$(gh issue create --title "$title" --body-file mail_body.md --assignee "${{ github.repository_owner }}")
              gh issue close "$url" > /dev/null
              echo "通知を作成: $url"
            fi
          fi

      - name: 失敗したらスマホに通知
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Nyusatsu Lab: daily update failed" -H "Tags: warning" -H "Priority: 4" \
              -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The daily collection job failed. Tap to open the GitHub Actions log." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
